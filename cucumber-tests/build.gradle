plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {

    testImplementation(
            "io.cucumber:cucumber-java:7.18.0"
    )

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2' //serializn ke liye, map ko json mei convert krta h

    testImplementation(
            "io.cucumber:cucumber-junit-platform-engine:7.18.0"
    )

    testImplementation(
            "org.junit.platform:junit-platform-suite:1.11.0"
    )

    testImplementation(
            "io.rest-assured:rest-assured:5.5.0"
    )

    testImplementation(
            "org.assertj:assertj-core:3.26.3"
    )
}

test {
    useJUnitPlatform()

    systemProperty "cucumber.plugin",
            "pretty,html:build/reports/cucumber.html"


}